  #   - natkit-v0-kafka
  #   environment:
  #     SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: natkit-v0-zookeeper:32181
  #     SCHEMA_REGISTRY_HOST_NAME: natkit-v0-schema-registry
