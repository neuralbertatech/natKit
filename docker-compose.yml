  #     KAFKA_REST_LISTENERS: http://natkit-v0-kafka-rest:38082
  #     KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://natkit-v0-kafka:29092
  #   networks:
  #     - natkit-v0-kafka-network

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/etc:/etc/mosquitto:Z
      - ./mosquitto/log:/mosquitto/log:Z
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:Z
    networks:
      - natkit-v0-kafka-network

  ntp:
    image: cturra/ntp:latest
    container_name: ntp
    restart: always
    ports:
      - 123:123/udp
    environment:
      - NTP_SERVERS=subitaneous.cpsc.ucalgary.ca
      - LOG_LEVEL=0
      - TZ=America/Edmonton
  #      - NOCLIENTLOG=true
  #      - ENABLE_NTS=true

  natkit-v0-bridge:
    image: natnl/natkit-bridge:latest
    container_name: natkit-v0-bridge
    restart: always
    environment:
      LIBNATKIT_KAFKA_BROKER_ADDRESS: natkit-v0-kafka
      LIBNATKIT_KAFKA_BROKER_PORT: 9092
      LIBNATKIT_MQTT_BROKER_ADDRESS: mosquitto
      LIBNATKIT_MQTT_BROKER_PORT: 1883
    networks:
      - natkit-v0-kafka-network
    depends_on:
      - natkit-v0-kafka
      - mosquitto

  natkit-v0-backend:
    image: docker.io/natnl/natkit-backend:latest
    container_name: natkit-v0-backend
    restart: always
    environment:
      LIBNATKIT_KAFKA_BROKER_ADDRESS: natkit-v0-kafka
      LIBNATKIT_KAFKA_BROKER_PORT: 9092
      # Persist saved stream graphs on the host so they survive container recreate
      # (the default ./data/stream_graphs.json lives in the ephemeral container
      # layer and is lost on `down`/rebuild).
      NATKIT_STREAM_GRAPH_STORE: /graphs/stream_graphs.json
      # Experiments live alongside the graphs: an experiment owns a board and its
      # recorded instances, so losing this store orphans history.
      NATKIT_EXPERIMENT_STORE: /graphs/experiments.json
      # Workspaces and profiles belong on the same volume for the same reason.
      # ⚠️ Both defaulted to ./data/*.json — the ephemeral layer — so a container
      # recreate lost them WHILE THEIR CONTENTS SURVIVED: membership lives on the
      # member (`workspace_id` on experiments, boards and profiles), so every
      # experiment would point at a workspace that no longer exists, and the picker
      # shows that as an empty list. It reads as "my experiments are gone".
      NATKIT_WORKSPACE_STORE: /graphs/workspaces.json
      NATKIT_PROFILE_STORE: /graphs/profiles.json
      # Materialized instance artifacts (Parquet + markers sidecar) — the
      # permanence guarantee, so never the container layer.
      NATKIT_INSTANCE_STORE: /instances
    ports:
      - "7409:7409"
    volumes:
      # ⚠️ These three were bind mounts into the repo tree (./natkit-backend/{log,
      # data,instances}) until TEC-NATKIT-70. `~/code` is Syncthing-synced, and the
      # standing rule is that live databases, runtime state and build artifacts do
      # not live under it: Syncthing resolving a conflict on stream_graphs.json
      # while the backend has it open leaves a .sync-conflict-* copy and whichever
      # version won, which the backend's atomic temp+rename cannot defend against.
      # The instances directory is worse — that is participant data, and it would
      # cross to every machine holding ~/code by a decision nobody made.
      #
      # Named volumes, matching docker-compose.dev.yml and .portainer.yml, so all
      # three stacks now agree and there is no host path to get wrong.
      - natkit-v0-backend-log:/logs
      - natkit-v0-graphs:/graphs
      - natkit-v0-instances:/instances
    networks:
      - natkit-v0-kafka-network
    depends_on:
      - natkit-v0-kafka

  natkit-v0-frontend:
    image: natnl/natkit-frontend:latest
    container_name: natkit-v0-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - natkit-v0-kafka-network
    depends_on:
      - natkit-v0-backend

volumes:
  # The broker's KRaft log dir (topic data + cluster metadata). Named, not a bind
  # mount, so it needs no :Z relabel and survives container recreation.
  natkit-v0-kafka-data:
  # The backend's four JSON stores (graphs, experiments, workspaces, profiles).
  natkit-v0-graphs:
  # Materialized instance artifacts (Parquet + markers sidecar) — the permanence
  # guarantee for a sealed recording, and sha256-verified read-only content. If an
  # existing deployment has data at ./natkit-backend/instances, COPY it in; never
  # let anything rewrite it. See TEC-NATKIT-70 for the migration.
  natkit-v0-instances:
  natkit-v0-backend-log:

networks:
  natkit-v0-kafka-network:
    external: false
