  # natkit-v0-kafka-rest:
  #   image: confluentinc/cp-kafka-rest:7.0.7
  #   hostname: natkit-v0-kafka-rest
  #   ports:
  #   - 38082:38082
  #   depends_on:
  #     - natkit-v0-schema-registry
  #   environment:
  #     KAFKA_REST_ZOOKEEPER_CONNECT: natkit-v0-zookeeper:32181
