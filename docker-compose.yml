  #     KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://natkit-v0-kafka:29092
  #   networks:
  #     - natkit-v0-kafka-network

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/etc:/etc/mosquitto:Z
      - ./mosquitto/log:/mosquitto/log:Z
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:Z
    networks:
      - natkit-v0-kafka-network

  ntp:
    image: cturra/ntp:latest
    container_name: ntp
    restart: always
    ports:
      - 123:123/udp
    environment:
      - NTP_SERVERS=subitaneous.cpsc.ucalgary.ca
      - LOG_LEVEL=0
      - TZ=America/Edmonton
  #      - NOCLIENTLOG=true
  #      - ENABLE_NTS=true

  natkit-v0-bridge:
    image: natnl/natkit-bridge:latest
    container_name: natkit-v0-bridge
    restart: always
    environment:
      LIBNATKIT_KAFKA_BROKER_ADDRESS: natkit-v0-kafka
      LIBNATKIT_KAFKA_BROKER_PORT: 9092
      LIBNATKIT_MQTT_BROKER_ADDRESS: mosquitto
      LIBNATKIT_MQTT_BROKER_PORT: 1883
    networks:
      - natkit-v0-kafka-network
    depends_on:
      - natkit-v0-kafka
      - mosquitto

  natkit-v0-backend:
    image: docker.io/natnl/natkit-backend:latest
    container_name: natkit-v0-backend
    restart: always
    environment:
      LIBNATKIT_KAFKA_BROKER_ADDRESS: natkit-v0-kafka
      LIBNATKIT_KAFKA_BROKER_PORT: 9092
    ports:
      - "7409:7409"
    volumes:
      - ./natkit-backend/log:/logs:Z
    networks:
      - natkit-v0-kafka-network
    depends_on:
      - natkit-v0-kafka

  #natkit-v0-frontend:
