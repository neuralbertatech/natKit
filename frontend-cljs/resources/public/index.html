<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>natKit · Visual Programming</title>
  <script>
    // The backend WebSocket URL is configuration, not a hardcode. Behind nginx
    // in prod this is absent and the app derives a same-origin ws:// URL. During
    // `shadow-cljs watch` the dev server is on :8280 while the backend is on
    // :7409, so point at it explicitly — cookies are host-scoped, not
    // port-scoped, so the natkit_session cookie still rides along.
    window.NATKIT_WS_URL = "ws://localhost:7409/ws/stream_viewer";
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/js/compiled/app.js"></script>
</body>
</html>
